[package]
name = "candyterm"
version = "0.1.0"
description = "Candyterm SSH & SFTP 桌面客户端"
authors = ["Candyterm Developer"]
license = "MIT"
edition = "2021"

[lib]
name = "candyterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-shell = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
anyhow = "1.0"
thiserror = "2.0"
russh = "0.49"
russh-keys = "0.49"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.14"
